[OptionExplanations]
Accel=Acelera, desacelera ou ajusta a velocidade das setas.
AllowExtraStage=Se ativado (e o Modo Evento desativado), o jogador pode participar em fases extra após completar certos requisitos.
AllowSongDeletion=Permite que os jogadores eliminem músicas do sistema premindo Ctrl+Retrocesso na roleta de música.
AllowW1=Ativa ou desativa o julgamento Fantástico. NUNCA: não mostra Fantásticos.\nSÓ PERCURSOS: só durante Sem Parar e Oni. SEMPRE: em todos os modos.
Announcer=Escolhe um locutor de entre os instalados.
Appearance=Aparência
Appearance Options=Muda o tema, o locutor e outras opções de estilo.
Theme Options=Muda opções e funções específicas do tema.
ArcadeOptionsNavigation=Estilo SM: Iniciar leva-o ao final, Cima/Baixo muda entre opções.\nEstilo Recreativo: Iniciar move o cursor para a linha seguinte.
Assist=Assistência
Attacks=Escolhe se os ataques fora de um percurso aparecem durante o jogo.
AttractSoundFrequency=Ative em SEMPRE para reproduzir som nos ecrãs de demonstração. Ative em N VEZES para reproduzir sons a cada N sequências de demonstração.
AutoAdjust=Autoajustar
AutoMapOnJoyChange=Se ativado, o jogo redistribuirá os comandos que não estavam ligados anteriormente. Se ativar a distribuição automática, quaisquer ajustes anteriores serão substituídos.
AutoPlay=Esta opção é útil para quem quiser jogar sem plataforma. No entanto, não será possível optar por pontuações máximas ou fases extra.
AutogenGroupCourses=Mostra percursos Sem Parar e Infinitos criados com o gerador automático.
AutogenSteps=Gera os passos automaticamente a partir de outros modos de jogo.
AxisFix=Solução alternativa para alguns adaptadores que mapeiam o D-Pad para o Eixo. Ainda não funciona no Mac OSX ou no controlador JS do Linux.
BGBrightness=Controla o brilho do fundo. Regule esta opção se tiver dificuldade em ver as notas.
Background=Muda opções que controlam os fundos que são reproduzidos enquanto joga.
BarDrain=Drenagem da barra.
BatLives=Vidas da bateria.
Bookkeeping=Mostrar estatísticas de contabilidade.
Calibrate Machine Sync=Calibra a sincronização de áudio.
CelShadeModels=Escolhe se as personagens são desenhadas com cel shading.
Center Image=Centra a imagem no seu monitor.
Characters=Personagens
Clear Bookkeeping Data=Limpar todos os dados de contabilidade.
Clear Machine Edits=Limpar todas as edições de passos guardadas nesta máquina.
Clear USB edits=Limpar edições no USB.
Clear Machine Stats=Limpar todas as pontuações guardadas nesta máquina.
CoinsPerCredit=Número de moedas que devem ser inseridas para que um jogador possa juntar-se (quando o modo Pagar está ativado).
Connection=Conecta com um servidor (que deve ser especificado).
CourseSortOrder=Determina quantos percursos são organizados.
CreateNew= 
Create New Course=Criar um novo percurso.
Create New Profile=Criar um novo perfil de jogador.
DancePointsForOni=Ativa se a pontuação no modo Oni mostra Pontos de Dança (DP) ou pontuação em percentagem.
DefaultFailType=Quando os jogadores ficam sem vida, IMEDIATO para o jogo de imediato; FIM DA MÚSICA no final, e DESLIGADO desativa o ecrã de falha.
DefaultFailTypeNoOff=Quando os jogadores ficam sem vida, IMEDIATO para o jogo de imediato, e FIM DA MÚSICA no final.
DefaultNoteSkin=Escolhe o design das setas que é exibido por defeito ao jogar.
DelayedBack=Se ativado, é necessário manter o botão Voltar premido durante 0,5 segundos para sair. Útil se premir o botão Voltar acidentalmente na plataforma.
DelayedTextureDelete=Ao ativá-lo, as texturas são mantidas na memória em vez de serem libertadas. Isto reduz o tempo de carregamento das texturas a partir do disco rígido da próxima vez que forem necessárias. Não o ative a menos que disponha de, pelo menos, 128 MB de memória RAM.
Delete=
Difficulty=
DisplayAspectRatio=Muda a relação de aspeto dos gráficos do jogo. A maioria dos ecrãs modernos são 16:9 ou 16:10.
DisplayColorDepth=Escolhe a profundidade de cor da janela. Esta opção pode não ter efeito no modo janela.
DisplayResolution=Escolhe...